<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Bebek Galau - Flappy Parodi 3D</title>
<style>
:root{--u:1px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{width:100%;height:100%;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;color:#fff;
  background:radial-gradient(ellipse at 50% 15%,#4a2a8f 0%,#1a0f3d 55%,#0b0620 100%);
  font-family:"Trebuchet MS","Segoe UI",Roboto,Arial,sans-serif}
.disp{font-family:Impact,Haettenschweiler,"Arial Narrow Bold","Arial Black",sans-serif;font-weight:900;letter-spacing:.02em}

#wrap{position:relative;width:min(100vw,62.5vh);width:min(100vw,62.5dvh);aspect-ratio:5/8;overflow:hidden;
  border-radius:calc(var(--u)*12);background:#000;touch-action:none;
  box-shadow:0 0 0 calc(var(--u)*3) #2a1760,0 calc(var(--u)*20) calc(var(--u)*60) rgba(0,0,0,.6)}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}

.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;z-index:5;
  transition:opacity .3s,visibility .3s}
.hidden{opacity:0;visibility:hidden;pointer-events:none}
.gone{display:none!important}

/* ---------- Menu ---------- */
#menu{justify-content:space-between;padding:calc(var(--u)*38) calc(var(--u)*20) calc(var(--u)*34);
  background:linear-gradient(rgba(10,5,40,.35),rgba(10,5,40,0) 45%,rgba(10,5,40,.0) 60%,rgba(10,5,40,.45))}
.titleBox{text-align:center;transform:rotate(-3deg);animation:wobble 2.6s ease-in-out infinite}
.t1,.t2{display:block;line-height:.92;-webkit-text-stroke:calc(var(--u)*2.5) #3a1a00;paint-order:stroke fill}
.t1{font-size:calc(var(--u)*86);color:#ffe14d;
  text-shadow:0 calc(var(--u)*3) 0 #e6a100,0 calc(var(--u)*6) 0 #c47a00,0 calc(var(--u)*9) 0 #8f5300,0 calc(var(--u)*16) calc(var(--u)*14) rgba(0,0,0,.5)}
.t2{font-size:calc(var(--u)*78);color:#ff5fa8;
  text-shadow:0 calc(var(--u)*3) 0 #d6307f,0 calc(var(--u)*6) 0 #a31b5f,0 calc(var(--u)*9) 0 #6d0f3f,0 calc(var(--u)*16) calc(var(--u)*14) rgba(0,0,0,.5)}
.tag{margin-top:calc(var(--u)*14);font-size:calc(var(--u)*15);font-weight:800;color:#fff;
  text-shadow:0 calc(var(--u)*2) calc(var(--u)*4) rgba(0,0,0,.7);transform:rotate(3deg)}
.menuBottom{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*14);width:100%}
.chip{background:rgba(0,0,0,.45);border:calc(var(--u)*2) solid rgba(255,255,255,.35);border-radius:999px;
  padding:calc(var(--u)*7) calc(var(--u)*18);font-size:calc(var(--u)*16);font-weight:800;
  box-shadow:0 calc(var(--u)*4) calc(var(--u)*10) rgba(0,0,0,.35)}
.chip b{color:#ffe14d;font-size:calc(var(--u)*20)}
.btn{font-family:Impact,Haettenschweiler,"Arial Black",sans-serif;font-weight:900;cursor:pointer;color:#fff;
  font-size:calc(var(--u)*28);letter-spacing:.05em;padding:calc(var(--u)*13) calc(var(--u)*44);
  border:calc(var(--u)*3) solid #2b1500;border-radius:calc(var(--u)*18);
  background:linear-gradient(#8dff72,#2ccf3f 60%,#1ea531);
  text-shadow:0 calc(var(--u)*2) 0 rgba(0,0,0,.45);
  box-shadow:0 calc(var(--u)*7) 0 #136b24,0 calc(var(--u)*12) calc(var(--u)*18) rgba(0,0,0,.45),inset 0 calc(var(--u)*3) 0 rgba(255,255,255,.45);
  transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(calc(var(--u)*5));
  box-shadow:0 calc(var(--u)*2) 0 #136b24,0 calc(var(--u)*4) calc(var(--u)*8) rgba(0,0,0,.45),inset 0 calc(var(--u)*3) 0 rgba(255,255,255,.35)}
.btn.big{animation:pulse 1.1s ease-in-out infinite}
.btn.alt{background:linear-gradient(#ffd36b,#ff9f1c 60%,#e07800);box-shadow:0 calc(var(--u)*7) 0 #8f4d00,0 calc(var(--u)*12) calc(var(--u)*18) rgba(0,0,0,.45),inset 0 calc(var(--u)*3) 0 rgba(255,255,255,.45)}
.btn.alt:active{box-shadow:0 calc(var(--u)*2) 0 #8f4d00,0 calc(var(--u)*4) calc(var(--u)*8) rgba(0,0,0,.45)}
.btn.small{font-size:calc(var(--u)*20);padding:calc(var(--u)*10) calc(var(--u)*22)}
.how{font-size:calc(var(--u)*13);font-weight:700;opacity:.92;text-align:center;line-height:1.5;
  text-shadow:0 calc(var(--u)*2) calc(var(--u)*4) rgba(0,0,0,.8)}

/* ---------- Hint ---------- */
#hint{position:absolute;left:0;right:0;top:61%;text-align:center;z-index:4;pointer-events:none;transition:opacity .25s}
#hint .finger{font-size:calc(var(--u)*46);animation:tap .7s ease-in-out infinite}
#hint .hintTxt{font-size:calc(var(--u)*30);color:#fff;-webkit-text-stroke:calc(var(--u)*2) #3a1a00;paint-order:stroke fill;
  text-shadow:0 calc(var(--u)*3) 0 rgba(0,0,0,.4)}
#hint .hintSub{font-size:calc(var(--u)*15);font-weight:800;text-shadow:0 calc(var(--u)*2) calc(var(--u)*4) #000}

/* ---------- Game Over ---------- */
#over{justify-content:center;background:rgba(10,5,35,.5)}
.card{width:84%;text-align:center;padding:calc(var(--u)*20) calc(var(--u)*16) calc(var(--u)*22);
  background:linear-gradient(#fff9dc,#ffe29b);border:calc(var(--u)*4) solid #3a1a00;border-radius:calc(var(--u)*24);
  color:#3a1a00;box-shadow:0 calc(var(--u)*10) 0 #8f5300,0 calc(var(--u)*24) calc(var(--u)*40) rgba(0,0,0,.55)}
#over:not(.hidden) .card{animation:pop .55s cubic-bezier(.2,1.4,.4,1)}
.go{font-size:calc(var(--u)*50);color:#ff4040;-webkit-text-stroke:calc(var(--u)*2.5) #3a1a00;paint-order:stroke fill;
  text-shadow:0 calc(var(--u)*4) 0 #9b1313;animation:shake .5s .3s}
.msg{font-size:calc(var(--u)*14);font-weight:800;font-style:italic;margin:calc(var(--u)*6) 0 calc(var(--u)*8);min-height:calc(var(--u)*36);
  display:flex;align-items:center;justify-content:center;line-height:1.25}
.medal{font-size:calc(var(--u)*54);line-height:1.1;filter:drop-shadow(0 calc(var(--u)*4) calc(var(--u)*4) rgba(0,0,0,.3))}
.rank{font-size:calc(var(--u)*17);font-weight:900;color:#b3470a;margin-bottom:calc(var(--u)*10)}
.scores{display:flex;gap:calc(var(--u)*10);justify-content:center;margin-bottom:calc(var(--u)*8)}
.sbox{flex:1;background:#3a1a00;color:#fff;border-radius:calc(var(--u)*14);padding:calc(var(--u)*8) 0}
.sbox span{display:block;font-size:calc(var(--u)*11);font-weight:800;letter-spacing:.12em;color:#ffd36b}
.sbox b{font-size:calc(var(--u)*38);line-height:1.05}
.newrec{display:inline-block;margin:calc(var(--u)*2) 0 calc(var(--u)*8);padding:calc(var(--u)*4) calc(var(--u)*14);
  background:linear-gradient(#ff7ac0,#ff3d8a);color:#fff;font-weight:900;font-size:calc(var(--u)*14);border-radius:999px;
  border:calc(var(--u)*2) solid #3a1a00;transform:rotate(-4deg);animation:pulse .8s ease-in-out infinite}
.row{display:flex;gap:calc(var(--u)*10);justify-content:center;margin-top:calc(var(--u)*6)}

/* ---------- Pause ---------- */
#pause{justify-content:center;background:rgba(10,5,35,.65);z-index:7;text-align:center}
#pause .pt{font-size:calc(var(--u)*64);-webkit-text-stroke:calc(var(--u)*2.5) #3a1a00;paint-order:stroke fill;color:#ffe14d}
#pause .ps{font-size:calc(var(--u)*16);font-weight:800;margin-top:calc(var(--u)*6)}

/* ---------- Mute ---------- */
#muteBtn{position:absolute;top:calc(var(--u)*8);right:calc(var(--u)*8);z-index:8;width:calc(var(--u)*42);height:calc(var(--u)*42);
  border-radius:50%;border:calc(var(--u)*2.5) solid rgba(255,255,255,.55);background:rgba(0,0,0,.5);color:#fff;
  font-size:calc(var(--u)*20);cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
#muteBtn:active{transform:scale(.92)}

@keyframes wobble{0%,100%{transform:rotate(-3deg) scale(1)}50%{transform:rotate(2deg) scale(1.04)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes tap{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(calc(var(--u)*-10)) scale(.9)}}
@keyframes pop{0%{transform:scale(.4) rotate(-6deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px) rotate(-2deg)}40%{transform:translateX(6px) rotate(2deg)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>

  <button id="muteBtn" aria-label="Suara">🔊</button>

  <div id="hint" class="hidden">
    <div class="finger">👆</div>
    <div class="hintTxt disp">TAP / SPASI</div>
    <div class="hintSub">biar bebeknya terbang!</div>
  </div>

  <div id="menu" class="overlay">
    <div class="titleBox disp">
      <span class="t1">BEBEK</span>
      <span class="t2">GALAU</span>
      <div class="tag" style="font-family:'Trebuchet MS',Arial,sans-serif">Flappy Bird versi gak jelas arah 🦆💨</div>
    </div>
    <div class="menuBottom">
      <div class="chip">🏆 Skor Terbaik: <b id="menuBest">0</b></div>
      <button id="btnStart" class="btn big">MULAI MAIN</button>
      <div class="how">Tap layar / tekan <b>SPASI</b> untuk terbang.<br>Hindari pipa-pipa julid yang ngeliatin kamu 👀</div>
    </div>
  </div>

  <div id="over" class="overlay hidden">
    <div class="card">
      <div class="go disp">GAME OVER</div>
      <div class="msg" id="goMsg"></div>
      <div class="medal" id="goMedal">🥚</div>
      <div class="rank" id="goRank"></div>
      <div class="scores">
        <div class="sbox"><span>SKOR</span><b class="disp" id="goScore">0</b></div>
        <div class="sbox"><span>TERBAIK</span><b class="disp" id="goBest">0</b></div>
      </div>
      <div class="newrec gone" id="goNew">🎉 REKOR BARU! 🎉</div>
      <div class="row">
        <button id="btnAgain" class="btn small">MAIN LAGI</button>
        <button id="btnMenu" class="btn small alt">MENU</button>
      </div>
    </div>
  </div>

  <div id="pause" class="overlay hidden">
    <div class="pt disp">PAUSE</div>
    <div class="ps">Tap layar / tekan SPASI untuk lanjut</div>
  </div>
</div>

<script>
(() => {
'use strict';

/* =====================================================================
   KONSTANTA & UTILITAS
===================================================================== */
const W = 400, H = 640, GROUND_Y = 550;
const GRAV = 0.42, FLAP = -7.5, MAXFALL = 10.5;
const PIPE_W = 72, CAP_W = 90, CAP_H = 38, SPACING = 225;
const BIRD_X = 110, BIRD_R = 12;
const TAU = Math.PI * 2;
const KEY_BEST = 'bebekGalauBest', KEY_MUTE = 'bebekGalauMute';

const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const hx = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix = (a, b, t) => 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * t) + ',' + Math.round(a[1] + (b[1] - a[1]) * t) + ',' + Math.round(a[2] + (b[2] - a[2]) * t) + ')';

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};

/* =====================================================================
   ELEMEN DOM
===================================================================== */
const wrap = $('wrap'), canvas = $('c'), ctx = canvas.getContext('2d');
const menuEl = $('menu'), overEl = $('over'), hintEl = $('hint'), pauseEl = $('pause');
const btnStart = $('btnStart'), btnAgain = $('btnAgain'), btnMenu = $('btnMenu'), muteBtn = $('muteBtn');
const menuBest = $('menuBest'), goMsg = $('goMsg'), goMedal = $('goMedal'), goRank = $('goRank');
const goScore = $('goScore'), goBest = $('goBest'), goNew = $('goNew');

/* =====================================================================
   STATE
===================================================================== */
let best = parseInt(store.get(KEY_BEST, '0'), 10) || 0;
let muted = store.get(KEY_MUTE, '0') === '1';

let state = 'menu';            // menu | ready | playing | dead
let paused = false;
let score = 0, newRecord = false, overShown = false, overAt = 0;
let time = 0, last = performance.now();
let groundX = 0, farX = 0, nearX = 0;
let shake = 0, flash = 0, hudPulse = 0, trailT = 0;
let skyPhase = 0, skyTarget = 0, lastTop = null;
let pipes = [], parts = [];
const bird = { x: BIRD_X, y: 300, vy: 0, rot: 0, wing: 0, kick: 0, squash: 0 };

const MSGS = [
  'Pipanya julid banget, ya?', 'Tabrakan lagi... sama pipa lagi...', 'Skill issue detected 🔍',
  'Ini bukan bug, ini fitur.', 'Gravitasi menang lagi hari ini.', 'Pipa: 1, Bebek: 0',
  'Sabar, bos. Namanya juga bebek galau.', 'Bebeknya capek, mau jadi bebek goreng aja.',
  'Jangan galau terus, coba lagi!', 'Bebek kok ngegas sendiri...', 'Pipanya ketawa tuh di belakang 😂'
];
const HYPE = ['MANTAP!', 'GOKIL!', 'ANJAY!', 'SULTAN!', 'WOW!', 'MENYALA!', 'KEREN!', 'GASKEUN!'];
const CONF = ['#ff4d6d', '#ffd23f', '#4dd2ff', '#7dff6b', '#c77dff', '#ff9f1c'];
const HUES = [130, 320, 28, 195, 270, 52];
const FLYERS = ['🛸', '🍕', '🐐', '🚁', '🪁', '🥟', '🍌'];

function rankFor(s) {
  if (s >= 50) return { m: '👑', t: 'Bebek Dewa Mabuk' };
  if (s >= 30) return { m: '🥇', t: 'Bebek Sultan' };
  if (s >= 15) return { m: '🥈', t: 'Bebek Gaul' };
  if (s >= 8)  return { m: '🥉', t: 'Bebek Kampung' };
  if (s >= 3)  return { m: '🐥', t: 'Bebek Pemula' };
  return { m: '🥚', t: 'Masih Telur' };
}

/* =====================================================================
   AUDIO (Web Audio API - semua suara sintetis)
===================================================================== */
const Snd = (() => {
  let ac = null, master, sfx, music, noiseBuf, timer = null, wanted = false;
  let nextT = 0, step = 0, loop = 0;
  const SPB = 0.2; // detik per langkah (1/8 note @150bpm)
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

  const MEL_A = [72,76,79,76,72,76,79,84, 77,81,77,74,77,81,79,77, 76,79,76,72,76,79,83,79, 74,77,74,71,72,0,67,0];
  const MEL_B = [79,76,72,76,79,76,84,79, 77,74,77,81,84,81,77,74, 76,72,76,79,76,79,83,84, 79,77,74,77,79,0,72,0];
  const ROOTS = [48, 53, 45, 43];
  const BASS = [0, null, 12, null, 0, null, 7, 12];

  function init() {
    if (ac) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    try { ac = new AC(); } catch (e) { ac = null; return false; }
    const comp = ac.createDynamicsCompressor();
    comp.connect(ac.destination);
    master = ac.createGain(); master.gain.value = muted ? 0 : 1; master.connect(comp);
    sfx = ac.createGain(); sfx.gain.value = 0.9; sfx.connect(master);
    music = ac.createGain(); music.gain.value = 0.5; music.connect(master);
    const len = ac.sampleRate;
    noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return true;
  }

  function tone(o) {
    if (!ac) return;
    const t = (o.at !== undefined) ? o.at : ac.currentTime + (o.delay || 0);
    const osc = ac.createOscillator(), g = ac.createGain();
    osc.type = o.type || 'square';
    osc.frequency.setValueAtTime(o.f, t);
    if (o.f2) osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.f2), t + o.dur);
    const v = o.vol !== undefined ? o.vol : 0.2;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(v, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
    osc.connect(g); g.connect(o.dest || sfx);
    osc.start(t); osc.stop(t + o.dur + 0.03);
  }

  function noise(o) {
    if (!ac) return;
    const t = (o.at !== undefined) ? o.at : ac.currentTime + (o.delay || 0);
    const src = ac.createBufferSource(); src.buffer = noiseBuf;
    const f = ac.createBiquadFilter(); f.type = o.ftype || 'lowpass';
    f.frequency.setValueAtTime(o.fq || 2000, t);
    if (o.fq2) f.frequency.exponentialRampToValueAtTime(o.fq2, t + o.dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(o.vol || 0.2, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
    src.connect(f); f.connect(g); g.connect(o.dest || sfx);
    src.start(t, Math.random() * 0.5); src.stop(t + o.dur + 0.03);
  }

  function playStep(s, t) {
    const mel = (loop % 2 === 0 ? MEL_A : MEL_B)[s];
    if (mel) tone({ type: 'square', f: mtof(mel), dur: SPB * 0.85, vol: 0.10, at: t, dest: music });
    const bar = s >> 3, bs = s & 7;
    const bp = BASS[bs];
    if (bp !== null) tone({ type: 'triangle', f: mtof(ROOTS[bar] + bp), dur: SPB * 0.9, vol: 0.24, at: t, dest: music });
    if (bs === 0 || bs === 4) tone({ type: 'sine', f: 170, f2: 45, dur: 0.13, vol: 0.38, at: t, dest: music });
    if (bs === 2 || bs === 6) noise({ ftype: 'bandpass', fq: 1800, dur: 0.09, vol: 0.10, at: t, dest: music });
    if (bs & 1) noise({ ftype: 'highpass', fq: 7000, dur: 0.04, vol: 0.05, at: t, dest: music });
  }

  function schedule() {
    if (!ac || !wanted) return;
    if (ac.state !== 'running') { nextT = ac.currentTime + 0.05; return; }
    while (nextT < ac.currentTime + 0.15) {
      playStep(step, nextT);
      nextT += SPB; step = (step + 1) % 32;
      if (step === 0) loop++;
    }
  }

  return {
    unlock() {
      if (!init()) return;
      if (ac.state === 'suspended') ac.resume();
      this.startMusic();
    },
    startMusic() {
      wanted = true;
      if (!ac || timer) return;
      nextT = ac.currentTime + 0.05; step = 0;
      timer = setInterval(schedule, 40);
    },
    duck(on) { if (ac) music.gain.setTargetAtTime(on ? 0.15 : 0.5, ac.currentTime, 0.15); },
    setMuted(m) { muted = m; if (ac) master.gain.setTargetAtTime(m ? 0 : 1, ac.currentTime, 0.03); },
    suspend() { if (ac && ac.state === 'running') ac.suspend(); },
    resume() { if (ac && ac.state === 'suspended') ac.resume(); },
    flap() {
      tone({ type: 'square', f: 380, f2: 780, dur: 0.09, vol: 0.16 });
      tone({ type: 'triangle', f: 190, f2: 390, dur: 0.1, vol: 0.2 });
    },
    score() {
      tone({ type: 'square', f: 880, dur: 0.08, vol: 0.16 });
      tone({ type: 'square', f: 1320, dur: 0.14, vol: 0.16, delay: 0.075 });
      tone({ type: 'sine', f: 2640, dur: 0.18, vol: 0.06, delay: 0.075 });
    },
    hit() {
      noise({ ftype: 'lowpass', fq: 3500, fq2: 200, dur: 0.28, vol: 0.5 });
      tone({ type: 'sawtooth', f: 240, f2: 50, dur: 0.3, vol: 0.28 });
    },
    die() {
      tone({ type: 'triangle', f: 640, f2: 90, dur: 0.7, vol: 0.28 });
      tone({ type: 'square', f: 320, f2: 60, dur: 0.7, vol: 0.1, delay: 0.05 });
    },
    record() {
      [523, 659, 784, 1047, 1319].forEach((f, i) => tone({ type: 'square', f, dur: 0.16, vol: 0.16, delay: i * 0.09 }));
    },
    click() { tone({ type: 'square', f: 520, f2: 960, dur: 0.07, vol: 0.14 }); }
  };
})();

/* =====================================================================
   RESIZE
===================================================================== */
function resize() {
  const r = wrap.getBoundingClientRect();
  if (!r.width) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  canvas.width = Math.round(r.width * dpr);
  canvas.height = Math.round(r.height * dpr);
  wrap.style.setProperty('--u', (r.width / 400) + 'px');
}

/* =====================================================================
   ASET PRA-RENDER (pseudo-3D: shading, bayangan, pencahayaan)
===================================================================== */
const assets = {};

function buildMountains() {
  const c = mk(400, 200), g = c.getContext('2d');
  const f = x => { const t = x / 400 * TAU; return 112 - 36 * Math.sin(t + 0.6) - 24 * Math.sin(2 * t + 1.9) - 15 * Math.sin(3 * t + 0.3) - 8 * Math.sin(5 * t + 2.2); };
  g.beginPath(); g.moveTo(0, 200);
  for (let x = 0; x <= 400; x += 4) g.lineTo(x, f(x));
  g.lineTo(400, 200); g.closePath();
  const gr = g.createLinearGradient(0, 20, 0, 200);
  gr.addColorStop(0, '#c3cff7'); gr.addColorStop(1, '#8196d6');
  g.fillStyle = gr; g.fill();
  g.save(); g.clip();
  g.fillStyle = 'rgba(255,255,255,.88)'; g.fillRect(0, 0, 400, 50);
  for (let x = 0; x < 400; x += 2) {
    const s = f(x + 2) - f(x - 2);
    if (s > 0) { g.fillStyle = 'rgba(40,50,130,.2)'; g.fillRect(x, f(x), 2, 200); }
  }
  g.restore();
  assets.mount = c;
}

function buildHills() {
  const c = mk(400, 120), g = c.getContext('2d');
  const f = x => { const t = x / 400 * TAU; return 62 + 14 * Math.sin(2 * t + 0.5) + 9 * Math.sin(3 * t + 2) + 5 * Math.sin(6 * t); };
  g.beginPath(); g.moveTo(0, 120);
  for (let x = 0; x <= 400; x += 4) g.lineTo(x, f(x));
  g.lineTo(400, 120); g.closePath();
  const gr = g.createLinearGradient(0, 40, 0, 120);
  gr.addColorStop(0, '#74d65f'); gr.addColorStop(1, '#2f8f3a');
  g.fillStyle = gr; g.fill();
  [30, 92, 168, 248, 318, 374].forEach((x, i) => {
    const y = f(x) + 4, r = 14 + (i % 3) * 4;
    g.fillStyle = '#6b4220'; g.fillRect(x - 2.5, y - 8, 5, 14);
    const rg = g.createRadialGradient(x - 5, y - r - 4, 2, x, y - r + 2, r + 4);
    rg.addColorStop(0, '#9af26b'); rg.addColorStop(1, '#1f7a2e');
    g.fillStyle = rg; g.beginPath(); g.arc(x, y - r + 2, r, 0, TAU); g.fill();
  });
  assets.hills = c;
}

function buildGround() {
  const c = mk(48, 90), g = c.getContext('2d');
  let gr = g.createLinearGradient(0, 0, 0, 90);
  gr.addColorStop(0, '#e6c277'); gr.addColorStop(.25, '#d0a04e'); gr.addColorStop(1, '#8a5a22');
  g.fillStyle = gr; g.fillRect(0, 0, 48, 90);
  [[8, 42, 4], [30, 58, 5], [18, 78, 3.5], [40, 36, 3]].forEach(p => {
    g.fillStyle = 'rgba(90,55,15,.3)'; g.beginPath(); g.ellipse(p[0], p[1], p[2] * 1.4, p[2], 0, 0, TAU); g.fill();
    g.fillStyle = 'rgba(255,235,170,.28)'; g.beginPath(); g.ellipse(p[0] - 1, p[1] - 1.5, p[2], p[2] * .6, 0, 0, TAU); g.fill();
  });
  gr = g.createLinearGradient(0, 0, 0, 20);
  gr.addColorStop(0, '#a5ec55'); gr.addColorStop(.6, '#4fb52b'); gr.addColorStop(1, '#2f7d1c');
  g.fillStyle = gr; g.fillRect(0, 0, 48, 20);
  g.save(); g.beginPath(); g.rect(0, 0, 48, 20); g.clip();
  g.fillStyle = 'rgba(255,255,255,.15)';
  for (let i = -2; i < 4; i++) {
    const x0 = i * 24;
    g.beginPath(); g.moveTo(x0, 0); g.lineTo(x0 + 12, 0); g.lineTo(x0 + 2, 20); g.lineTo(x0 - 10, 20); g.closePath(); g.fill();
  }
  g.restore();
  g.fillStyle = '#215c13'; g.fillRect(0, 20, 48, 3);
  gr = g.createLinearGradient(0, 23, 0, 40);
  gr.addColorStop(0, 'rgba(0,0,0,.3)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0, 23, 48, 17);
  assets.ground = c;
}

function buildVignette() {
  const c = mk(400, 640), g = c.getContext('2d');
  const gr = g.createRadialGradient(200, 320, 180, 200, 320, 460);
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,.38)');

/* =====================================================================
   LANGIT, BINTANG, AWAN
===================================================================== */
const PAL = [
  { top: hx('#3fb4ff'), bot: hx('#c8f0ff'), cloud: hx('#ffffff'), shade: hx('#cfe6f7'), dark: 0,    stars: 0,   sunY: 105, moonY: -90 },
  { top: hx('#5b3a8e'), bot: hx('#ff9a6b'), cloud: hx('#ffd9c2'), shade: hx('#e79a8f'), dark: .12,  stars: .2,  sunY: 300, moonY: -90 },
  { top: hx('#070b25'), bot: hx('#27386f'), cloud: hx('#8c9bd6'), shade: hx('#5a69a8'), dark: .38,  stars: 1,   sunY: 720, moonY: 105 }
];
function palAt(ph) {
  const i = Math.floor(ph), f0 = ph - i, f = f0 * f0 * (3 - 2 * f0);
  const A = PAL[((i % 3) + 3) % 3], B = PAL[(((i + 1) % 3) + 3) % 3];
  return {
    top: mix(A.top, B.top, f), bot: mix(A.bot, B.bot, f),
    cloud: mix(A.cloud, B.cloud, f), shade: mix(A.shade, B.shade, f),
    dark: A.dark + (B.dark - A.dark) * f, stars: A.stars + (B.stars - A.stars) * f,
    sunY: A.sunY + (B.sunY - A.sunY) * f, moonY: A.moonY + (B.moonY - A.moonY) * f
  };
}

const stars = Array.from({ length: 55 }, () => ({ x: rand(0, W), y: rand(0, 360), r: rand(1, 2.4), sp: rand(.5, 1.6), ph: rand(0, 6) }));
const clouds = Array.from({ length: 7 }, (_, i) => ({ x: rand(0, W), y: rand(30, 300), s: rand(.6, 1.3), v: rand(.15, .45) }));
let flyer = null, flyerTimer = 250;

function drawCloud(c, pal) {
  ctx.save(); ctx.translate(c.x, c.y); ctx.scale(c.s, c.s);
  const cs = [[0, 0, 22], [24, -10, 28], [54, -2, 24], [78, 6, 18], [-22, 8, 16], [30, 10, 24]];
  ctx.fillStyle = pal.shade;
  cs.forEach(p => { ctx.beginPath(); ctx.arc(p[0], p[1] + 7, p[2], 0, TAU); ctx.fill(); });
  ctx.fillStyle = pal.cloud;
  cs.forEach(p => { ctx.beginPath(); ctx.arc(p[0], p[1], p[2], 0, TAU); ctx.fill(); });
  ctx.restore();
}

/* =====================================================================
   PARTIKEL
===================================================================== */
function emit(o) {
  const p = Object.assign({ x: 0, y: 0, vx: 0, vy: 0, g: 0.15, drag: 0.99, life: 40, size: 6, rot: 0, vr: 0, color: '#fff', type: 'circle', txt: '' }, o);
  p.max = p.life; parts.push(p);
}
function starPath(x, y, r) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r;
    ctx[i ? 'lineTo' : 'moveTo'](x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  ctx.closePath();
}
function updateParts(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.vx *= Math.pow(p.drag, dt); p.vy += p.g * dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; p.life -= dt;
    if (p.life <= 0) parts.splice(i, 1);
  }
}
function drawParts() {
  for (const p of parts) {
    const a = clamp(p.life / (p.max * .45), 0, 1);
    ctx.save(); ctx.globalAlpha = a; ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    if (p.type === 'rect') { ctx.fillStyle = p.color; ctx.fillRect(-p.size / 2, -p.size / 3, p.size, p.size * .6); }
    else if (p.type === 'star') { ctx.fillStyle = p.color; starPath(0, 0, p.size); ctx.fill(); }
    else if (p.type === 'feather') {
      ctx.fillStyle = p.color; ctx.strokeStyle = 'rgba(90,51,0,.6)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.ellipse(0, 0, p.size * 1.5, p.size * .55, 0, 0, TAU); ctx.fill(); ctx.stroke();
    }
    else if (p.type === 'emoji') {
      ctx.font = p.size + 'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const sc = 1 + (1 - a) * .6; ctx.scale(sc, sc); ctx.fillText(p.txt, 0, 0);
    }
    else if (p.type === 'text') {
      ctx.font = '900 ' + p.size + 'px Impact,"Arial Black",sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
      ctx.lineWidth = p.size / 4; ctx.strokeStyle = '#3a1a00'; ctx.strokeText(p.txt, 0, 0);
      ctx.fillStyle = p.color; ctx.fillText(p.txt, 0, 0);
    }
    else { ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(0, 0, p.size * (.5 + a * .5), 0, TAU); ctx.fill(); }
    ctx.restore();
  }
}

/* =====================================================================
   GAMEPLAY
===================================================================== */
function pipeSpeed() { return Math.min(4.3, 2.6 + score * 0.045); }

function resetWorld() {
  score = 0; newRecord = false; overShown = false;
  pipes = []; parts = []; lastTop = null;
  bird.y = 300; bird.vy = 0; bird.rot = 0; bird.kick = 0; bird.squash = 0;
  shake = 0; flash = 0; hudPulse = 0; skyTarget = 0;
  Snd.duck(false);
}

function spawnPipe() {
  const gap = Math.max(126, 162 - score * 0.9);
  const amp = (score >= 7 && Math.random() < 0.55) ? Math.min(36, 12 + (score - 7) * 1.6) : 0;
  const minTop = 72 + amp, maxTop = GROUND_Y - 72 - gap - amp;
  let top = rand(minTop, maxTop);
  if (lastTop !== null) top = clamp(clamp(top, lastTop - 170, lastTop + 170), minTop, maxTop);
  lastTop = top;
  pipes.push({ x: W + 60, base: top, gy: top, gap, amp, ph: rand(0, 6.28), passed: false, hue: pick(HUES) });
}

function flap() {
  bird.vy = FLAP; bird.kick = 1; bird.squash = 1;
  Snd.flap();
  for (let i = 0; i < 4; i++) emit({ x: bird.x - 12, y: bird.y + 8, vx: rand(-2, -.5), vy: rand(.5, 2), g: 0, life: 20, size: rand(3, 6), color: 'rgba(255,255,255,.8)' });
}

function addScore(p) {
  score++; hudPulse = 1; Snd.score();
  for (let i = 0; i < 16; i++) emit({ x: bird.x, y: bird.y, vx: rand(-4, 4), vy: rand(-6, 1), g: .25, life: rand(30, 55), size: rand(6, 11), rot: rand(0, 6), vr: rand(-.3, .3), color: pick(CONF), type: 'rect' });
  for (let i = 0; i < 6; i++) emit({ x: bird.x, y: bird.y, vx: rand(-3, 3), vy: rand(-4, 0), g: .1, life: rand(25, 40), size: rand(5, 9), color: '#fff27a', type: 'star', vr: .1 });
  emit({ x: bird.x + 24, y: bird.y - 22, vy: -1.1, g: 0, life: 45, size: 26, color: '#fff27a', type: 'text', txt: '+1' });
  if (score % 5 === 0) emit({ x: W / 2, y: 190, vy: -.4, g: 0, life: 80, size: 46, color: pick(CONF), type: 'text', txt: pick(HYPE), rot: rand(-.12, .12) });
  skyTarget = Math.floor(score / 10);
}

function circRect(cx, cy, r, rx, ry, rw, rh) {
  const nx = clamp(cx, rx, rx + rw), ny = clamp(cy, ry, ry + rh);
  const dx = cx - nx, dy = cy - ny;
  return dx * dx + dy * dy < r * r;
}
function hitPipe(p) {
  const bx = bird.x, by = bird.y, r = BIRD_R, gy = p.gy, bt = gy + p.gap;
  const bL = p.x - PIPE_W / 2, cL = p.x - CAP_W / 2 + 3;
  return circRect(bx, by, r, bL, -60, PIPE_W, gy - CAP_H + 60) ||
         circRect(bx, by, r, cL, gy - CAP_H, CAP_W - 6, CAP_H) ||
         circRect(bx, by, r, cL, bt, CAP_W - 6, CAP_H) ||
         circRect(bx, by, r, bL, bt + CAP_H, PIPE_W, H);
}

function die(kind) {
  if (state !== 'playing') return;
  state = 'dead';
  bird.vy = kind === 'pipe' ? -3.4 : 0;
  shake = 16; flash = .85;
  for (let i = 0; i < 26; i++) emit({ x: bird.x, y: bird.y, vx: rand(-6, 6), vy: rand(-7, 3), g: .22, drag: .97, life: rand(40, 75), size: rand(4, 8), rot: rand(0, 6), vr: rand(-.3, .3), color: pick(['#ffd23f', '#fff6b0', '#ffffff', '#ff9d1c']), type: 'feather' });
  for (let i = 0; i < 10; i++) emit({ x: bird.x, y: bird.y, vx: rand(-5, 5), vy: rand(-6, 2), g: .15, life: rand(30, 50), size: rand(6, 11), color: pick(['#ff4d6d', '#fff27a', '#ff9f1c']), type: 'star', vr: .15 });
  emit({ x: bird.x + 10, y: bird.y, vx: 0, vy: 0, g: 0, life: 30, size: 64, type: 'emoji', txt: '💥' });
  emit({ x: bird.x - 12, y: bird.y - 30, vx: 0, vy: -1, g: 0, life: 50, size: 30, type: 'emoji', txt: '💫' });
  Snd.hit(); setTimeout(Snd.die, 170); Snd.duck(true);
  if (score > best) { best = score; newRecord = true; store.set(KEY_BEST, String(best)); }
  overAt = performance.now() + (kind === 'ground' ? 650 : 900);
}

function showOver() {
  overShown = true;
  goMsg.textContent = pick(MSGS);
  const r = rankFor(score);
  goMedal.textContent = r.m; goRank.textContent = r.t;
  goScore.textContent = score; goBest.textContent = best;
  goNew.classList.toggle('gone', !newRecord);
  overEl.classList.remove('hidden');
  if (newRecord) Snd.record();
}

/* =====================================================================
   TRANSISI STATE
===================================================================== */
function goMenu() {
  state = 'menu'; resetWorld();
  menuBest.textContent = best;
  menuEl.classList.remove('hidden'); overEl.classList.add('hidden'); hintEl.classList.add('hidden');
}
function goReady() {
  state = 'ready'; resetWorld();
  menuEl.classList.add('hidden'); overEl.classList.add('hidden'); hintEl.classList.remove('hidden');
}
function startPlay() {
  state = 'playing';
  hintEl.classList.add('hidden');
  spawnPipe();
  flap();
}

function action() {
  Snd.unlock();
  if (paused) { togglePause(); return; }
  if (state === 'menu') { Snd.click(); goReady(); }
  else if (state === 'ready') startPlay();
  else if (state === 'playing') flap();
  else if (state === 'dead' && overShown && performance.now() > overAt + 350) { Snd.click(); goReady(); }
}

function togglePause() {
  if (paused) {
    paused = false; pauseEl.classList.add('hidden'); last = performance.now(); Snd.resume();
    return;
  }
  if (state !== 'playing') return;
  paused = true; pauseEl.classList.remove('hidden');
}

function toggleMute() {
  Snd.unlock();
  muted = !muted; Snd.setMuted(muted);
  store.set(KEY_MUTE, muted ? '1' : '0');
  muteBtn.textContent = muted ? '🔇' : '🔊';
}

/* =====================================================================
   UPDATE
===================================================================== */
function update(dt, now) {
  time += dt;
  skyPhase += (skyTarget - skyPhase) * Math.min(1, 0.025 * dt);
  const playing = state === 'playing';
  const spd = playing ? pipeSpeed() : (state === 'dead' ? 0 : 1.6);

  if (state !== 'dead') { groundX += spd * dt; farX += spd * 0.1 * dt; nearX += spd * 0.3 * dt; }

  for (const c of clouds) {
    c.x -= c.v * (0.4 + spd * 0.25) * dt;
    if (c.x < -140) { c.x = W + 140; c.y = rand(30, 300); }
  }
  flyerTimer -= dt;
  if (!flyer && flyerTimer <= 0) { flyer = { e: pick(FLYERS), x: W + 40, y: rand(70, 260), v: rand(.9, 1.7), ph: 0 }; flyerTimer = rand(500, 1100); }
  if (flyer) { flyer.x -= flyer.v * dt; flyer.ph += .05 * dt; if (flyer.x < -60) flyer = null; }

  // burung
  if (state === 'menu' || state === 'ready') {
    bird.y = 300 + Math.sin(time * 0.08) * 9; bird.vy = 0;
    bird.rot = Math.sin(time * 0.08) * 0.1; bird.wing += dt * 0.22;
  } else {
    bird.vy = Math.min(bird.vy + GRAV * dt, MAXFALL);
    bird.y += bird.vy * dt;
    if (playing) {
      const tr = clamp(bird.vy * 0.075, -0.5, 1.25);
      bird.rot += (tr - bird.rot) * Math.min(1, 0.3 * dt);
      if (bird.y < 14) { bird.y = 14; if (bird.vy < 0) bird.vy = 0; }
      bird.wing += dt * (0.22 + bird.kick * 0.55);
      trailT -= dt;
      if (trailT <= 0) {
        trailT = 4;
        emit({ x: bird.x - 18, y: bird.y + rand(-3, 5), vx: -spd * .5, vy: rand(-.3, .3), g: 0, life: 22, size: rand(3, 6), color: 'rgba(255,255,255,.55)' });
      }
    } else {
      bird.rot += (1.5 - bird.rot) * Math.min(1, 0.08 * dt);
      if (bird.y >= GROUND_Y - 12) { bird.y = GROUND_Y - 12; bird.vy = 0; }
    }
  }
  bird.kick = Math.max(0, bird.kick - 0.07 * dt);
  bird.squash = Math.max(0, bird.squash - 0.12 * dt);

  // pipa
  if (playing) {
    const lastP = pipes[pipes.length - 1];
    if (!lastP || lastP.x <= W + 60 - SPACING) spawnPipe();
    for (let i = pipes.length - 1; i >= 0; i--) {
      const p = pipes[i];
      p.x -= spd * dt; p.ph += 0.03 * dt;
      p.gy = p.base + Math.sin(p.ph) * p.amp;
      if (!p.passed && p.x < bird.x) { p.passed = true; addScore(p); }
      if (p.x < -70) pipes.splice(i, 1);
    }
    for (const p of pipes) { if (hitPipe(p)) { die('pipe'); break; } }
    if (state === 'playing' && bird.y + BIRD_R >= GROUND_Y) { bird.y = GROUND_Y - BIRD_R; die('ground'); }
  }

  updateParts(dt);
  hudPulse = Math.max(0, hudPulse - 0.08 * dt);
  shake *= Math.pow(0.9, dt);
  flash = Math.max(0, flash - 0.06 * dt);

  if (state === 'dead' && !overShown && now >= overAt) showOver();
}

/* =====================================================================
   RENDER
===================================================================== */
function rr(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

function tubeShade(x, w) {
  const g = ctx.createLinearGradient(x, 0, x + w, 0);
  g.addColorStop(0, 'rgba(0,0,0,.5)'); g.addColorStop(.18, 'rgba(255,255,255,.06)');
  g.addColorStop(.32, 'rgba(255,255,255,.48)'); g.addColorStop(.52, 'rgba(255,255,255,0)');
  g.addColorStop(.8, 'rgba(0,0,0,.28)'); g.addColorStop(1, 'rgba(0,0,0,.58)');
  return g;
}

function drawTube(x, y, w, h, hue, anchor, dir) {
  if (h <= 0) return;
  ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.fillRect(x + 10, y + 6, w, h);
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  ctx.fillStyle = 'hsl(' + hue + ',78%,47%)'; ctx.fillRect(x, y, w, h);
  for (let k = -1; k < 16; k++) {
    const y0 = dir > 0 ? anchor + k * 46 : anchor - k * 46 - 22;
    ctx.fillStyle = 'rgba(255,255,255,.14)'; ctx.fillRect(x, y0, w, 22);
    ctx.fillStyle = 'rgba(0,0,0,.14)'; ctx.fillRect(x, y0 + 22, w, 2);
  }
  ctx.fillStyle = tubeShade(x, w); ctx.fillRect(x, y, w, h);
  ctx.restore();
  ctx.strokeStyle = 'hsl(' + hue + ',70%,16%)'; ctx.lineWidth = 3; ctx.strokeRect(x, y, w, h);
}

function drawEye(ex, ey) {
  if (state === 'dead') {
    ctx.strokeStyle = '#2a1200'; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(ex, ey + 3, 7, Math.PI * 1.12, Math.PI * 1.88); ctx.stroke();
    return;
  }
  const g = ctx.createRadialGradient(ex - 3, ey - 3, 1, ex, ey, 10);
  g.addColorStop(0, '#fff'); g.addColorStop(1, '#d6d6e6');
  ctx.fillStyle = g; ctx.strokeStyle = '#2a1200'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(ex, ey, 9, 0, TAU); ctx.fill(); ctx.stroke();
  const dx = bird.x - ex, dy = bird.y - ey, d = Math.hypot(dx, dy) || 1;
  const px = ex + dx / d * 4, py = ey + dy / d * 4;
  ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(px, py, 4.6, 0, TAU); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(px - 1.5, py - 1.8, 1.6, 0, TAU); ctx.fill();
}

function drawCap(x, y, hue, p) {
  ctx.fillStyle = 'rgba(0,0,0,.25)'; rr(x + 10, y + 6, CAP_W, CAP_H, 9); ctx.fill();
  ctx.save(); rr(x, y, CAP_W, CAP_H, 9); ctx.clip();
  ctx.fillStyle = 'hsl(' + hue + ',80%,50%)'; ctx.fillRect(x, y, CAP_W, CAP_H);
  ctx.fillStyle = tubeShade(x, CAP_W); ctx.fillRect(x, y, CAP_W, CAP_H);
  ctx.fillStyle = 'rgba(255,255,255,.3)'; ctx.fillRect(x + 8, y + 3, CAP_W - 16, 3);
  ctx.restore();
  ctx.strokeStyle = 'hsl(' + hue + ',70%,16%)'; ctx.lineWidth = 3; rr(x, y, CAP_W, CAP_H, 9); ctx.stroke();
  // mata julid
  const cx = x + CAP_W / 2, ey = y + CAP_H / 2 + 2;
  drawEye(cx - 15, ey); drawEye(cx + 15, ey);
  if (state !== 'dead') {
    ctx.strokeStyle = '#2a1200'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(cx - 27, ey - 12); ctx.lineTo(cx - 7, ey - 8); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx + 27, ey - 12); ctx.lineTo(cx + 7, ey - 8); ctx.stroke();
  }
}

function drawPipe(p) {
  if (p.x < -70 || p.x > W + 70) return;
  const gy = p.gy, by = gy + p.gap, h = p.hue;
  drawTube(p.x - PIPE_W / 2, -10, PIPE_W, gy - CAP_H + 10, h, gy - CAP_H, -1);
  drawCap(p.x - CAP_W / 2, gy - CAP_H, h, p);
  drawCap(p.x - CAP_W / 2, by, h, p);
  drawTube(p.x - PIPE_W / 2, by + CAP_H, PIPE_W, GROUND_Y - (by + CAP_H) + 10, h, by + CAP_H, 1);
}

function eyeBird(x, y, r, px, py, dead) {
  if (dead) {
    ctx.strokeStyle = '#222'; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
    const s = r * .6;
    ctx.beginPath(); ctx.moveTo(x - s, y - s); ctx.lineTo(x + s, y + s); ctx.moveTo(x + s, y - s); ctx.lineTo(x - s, y + s); ctx.stroke();
    return;
  }
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#3b2400'; ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(x + px, y + py, r * .45, 0, TAU); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x + px - 1, y + py - 1.2, r * .14, 0, TAU); ctx.fill();
}

function drawBird() {
  const b = bird, dead = state === 'dead';
  ctx.save();
  ctx.translate(b.x, b.y); ctx.rotate(b.rot);
  ctx.scale(1 + b.squash * .16, 1 - b.squash * .16);
  ctx.lineJoin = 'round'; ctx.lineWidth = 2.2; ctx.strokeStyle = '#5a3300';
  // ekor
  ctx.fillStyle = '#ef8a00';
  ctx.beginPath(); ctx.moveTo(-15, -3); ctx.lineTo(-29, -11); ctx.lineTo(-25, -2); ctx.lineTo(-30, 4); ctx.lineTo(-24, 5); ctx.lineTo(-15, 7); ctx.closePath(); ctx.fill(); ctx.stroke();
  // badan (bola 3D)
  let g = ctx.createRadialGradient(-6, -9, 3, 0, 0, 27);
  g.addColorStop(0, '#fff7a8'); g.addColorStop(.45, '#ffd23f'); g.addColorStop(1, '#e08400');
  ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(0, 0, 20, 17, 0, 0, TAU); ctx.fill(); ctx.stroke();
  // perut
  ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.beginPath(); ctx.ellipse(4, 8, 12, 7, .15, 0, TAU); ctx.fill();
  // sayap
  const wa = dead ? 1 : Math.sin(b.wing) * .85 - .15;
  ctx.save(); ctx.translate(-6, 3); ctx.rotate(wa);
  g = ctx.createLinearGradient(-20, 0, 2, 0); g.addColorStop(0, '#ff7a00'); g.addColorStop(1, '#ffb02e');
  ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(-8, 0, 12, 6.5, 0, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.restore();
  // paruh
  const open = b.kick * 5 + (dead ? 6 : 0);
  ctx.fillStyle = '#d9560c'; ctx.beginPath(); ctx.moveTo(15, 3); ctx.quadraticCurveTo(28, 3 + open, 29, 7 + open); ctx.quadraticCurveTo(21, 11 + open, 14, 9); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#ff9d1c'; ctx.beginPath(); ctx.moveTo(14, -4); ctx.quadraticCurveTo(31, -5, 32, 1); ctx.quadraticCurveTo(24, 4, 14, 3); ctx.closePath(); ctx.fill(); ctx.stroke();
  // mata juling
  const look = clamp(b.vy * .3, -2, 3);
  eyeBird(3, -9, 7.5, 2.6, look, dead);
  eyeBird(15, -8, 5.5, -1.6, look, dead);
  // alis menyatu + jambul
  ctx.strokeStyle = '#3b2400'; ctx.lineCap = 'round'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(-4, -19); ctx.quadraticCurveTo(8, -24, 21, -15); ctx.stroke();
  ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.moveTo(-6, -15); ctx.quadraticCurveTo(-12, -26, -4, -27);
  ctx.moveTo(-2, -16); ctx.quadraticCurveTo(-4, -30, 3, -28);
  ctx.moveTo(2, -16); ctx.quadraticCurveTo(6, -27, 11, -23); ctx.stroke();
  // pipi merona + kilap
  ctx.fillStyle = 'rgba(255,90,120,.45)'; ctx.beginPath(); ctx.arc(7, 3, 4.5, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.beginPath(); ctx.ellipse(-9, -9, 6, 3.5, -.5, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawHUD() {
  if (state === 'menu' || (state === 'dead' && overShown)) return;
  ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  const sc = 1 + hudPulse * .35;
  ctx.translate(W / 2, 92); ctx.scale(sc, sc);
  ctx.font = '900 70px Impact,"Arial Black",sans-serif';
  ctx.lineWidth = 11; ctx.strokeStyle = '#3b1d00'; ctx.strokeText(String(score), 0, 3);
  const g = ctx.createLinearGradient(0, -34, 0, 34); g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#ffe14d');
  ctx.fillStyle = g; ctx.fillText(String(score), 0, 0);
  ctx.restore();
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,.4)'; rr(10, 10, 104, 30, 15); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = '800 16px "Trebuchet MS",Arial,sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText('🏆 ' + best, 22, 26);
  ctx.restore();
}

function render() {
  ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const pal = palAt(skyPhase);

  ctx.save();
  if (shake > 0.2) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);

  // langit
  let g = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
  g.addColorStop(0, pal.top); g.addColorStop(1, pal.bot);
  ctx.fillStyle = g; ctx.fillRect(-20, -20, W + 40, H + 40);

  // bintang
  if (pal.stars > 0.02) {
    for (const s of stars) {
      ctx.globalAlpha = pal.stars * (0.5 + 0.5 * Math.sin(time * 0.05 * s.sp + s.ph));
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(s.x, s.y, s.r * .6, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  // matahari
  if (pal.sunY < H) {
    g = ctx.createRadialGradient(310, pal.sunY, 10, 310, pal.sunY, 110);
    g.addColorStop(0, 'rgba(255,240,150,.9)'); g.addColorStop(.4, 'rgba(255,200,80,.3)'); g.addColorStop(1, 'rgba(255,200,80,0)');
    ctx.fillStyle = g; ctx.fillRect(180, pal.sunY - 130, 260, 260);
    g = ctx.createRadialGradient(302, pal.sunY - 6, 3, 310, pal.sunY, 36);
    g.addColorStop(0, '#fffbe0'); g.addColorStop(.6, '#ffd54a'); g.addColorStop(1, '#ff9a2e');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(310, pal.sunY, 34, 0, TAU); ctx.fill();
  }
  // bulan
  if (pal.moonY > -60) {
    g = ctx.createRadialGradient(300, pal.moonY, 20, 300, pal.moonY, 80);
    g.addColorStop(0, 'rgba(220,230,255,.35)'); g.addColorStop(1, 'rgba(220,230,255,0)');
    ctx.fillStyle = g; ctx.fillRect(210, pal.moonY - 90, 180, 180);
    g = ctx.createRadialGradient(292, pal.moonY - 8, 3, 300, pal.moonY, 30);
    g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#cfd5ea');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(300, pal.moonY, 28, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(120,130,170,.35)';
    [[290, -6, 6], [310, 8, 5], [303, -14, 3.5]].forEach(c => { ctx.beginPath(); ctx.arc(c[0], pal.moonY + c[1], c[2], 0, TAU); ctx.fill(); });
  }
  // awan + makhluk iseng
  for (const c of clouds) drawCloud(c, pal);
  if (flyer) {
    ctx.save(); ctx.translate(flyer.x, flyer.y + Math.sin(flyer.ph) * 8); ctx.rotate(Math.sin(flyer.ph * .8) * .25);
    ctx.font = '30px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(flyer.e, 0, 0);
    ctx.restore();
  }
  // gunung & bukit (parallax)
  let x0 = -Math.floor(farX % 400);
  ctx.drawImage(assets.mount, x0, GROUND_Y - 190, 401, 200); ctx.drawImage(assets.mount, x0 + 400, GROUND_Y - 190, 401, 200);
  x0 = -Math.floor(nearX % 400);
  ctx.drawImage(assets.hills, x0, GROUND_Y - 112, 401, 120); ctx.drawImage(assets.hills, x0 + 400, GROUND_Y - 112, 401, 120);
  ctx.fillStyle = 'rgba(6,8,40,' + pal.dark + ')'; ctx.fillRect(-20, -20, W + 40, GROUND_Y + 20);

  // pipa
  for (const p of pipes) drawPipe(p);

  // tanah
  g = ctx.createLinearGradient(0, GROUND_Y - 16, 0, GROUND_Y);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.18)');
  ctx.fillStyle = g; ctx.fillRect(0, GROUND_Y - 16, W, 16);
  const gx = -Math.floor(groundX % 48);
  for (let x = gx; x < W + 48; x += 48) ctx.drawImage(assets.ground, x, GROUND_Y, 49, 90);

  // sedikit gelap untuk pipa+tanah saat malam
  ctx.fillStyle = 'rgba(6,8,40,' + (pal.dark * .35) + ')'; ctx.fillRect(-20, 0, W + 40, H + 20);

  // bayangan burung di tanah
  const dist = GROUND_Y - bird.y, ss = clamp(1 - dist / 520, .3, 1);
  ctx.fillStyle = 'rgba(0,0,0,' + (.3 * ss) + ')';
  ctx.beginPath(); ctx.ellipse(bird.x - 4, GROUND_Y + 14, 22 * ss, 5 * ss, 0, 0, TAU); ctx.fill();

  drawBird();
  drawParts();

  ctx.drawImage(assets.vig, -10, -10, W + 20, H + 20);
  ctx.restore();

  if (flash > 0.01) { ctx.fillStyle = 'rgba(255,255,255,' + flash + ')'; ctx.fillRect(0, 0, W, H); }
  drawHUD();
}

/* =====================================================================
   LOOP
===================================================================== */
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 16.6667; last = now;
  if (!(dt > 0)) dt = 0; if (dt > 2.5) dt = 2.5;
  if (!paused) update(dt, now);
  render();
}

/* =====================================================================
   INPUT
===================================================================== */
canvas.addEventListener('pointerdown', e => { e.preventDefault(); action(); });
pauseEl.addEventListener('pointerdown', e => { e.preventDefault(); action(); });
wrap.addEventListener('contextmenu', e => e.preventDefault());

btnStart.addEventListener('click', () => { Snd.unlock(); Snd.click(); goReady(); btnStart.blur(); });
btnAgain.addEventListener('click', () => { Snd.unlock(); Snd.click(); goReady(); btnAgain.blur(); });
btnMenu.addEventListener('click', () => { Snd.unlock(); Snd.click(); goMenu(); btnMenu.blur(); });
muteBtn.addEventListener('click', () => { toggleMute(); muteBtn.blur(); });

window.addEventListener('keydown', e => {
  const k = e.code;
  if (k === 'Space' || k === 'ArrowUp' || k === 'KeyW' || k === 'Enter') {
    e.preventDefault();
    if (e.repeat) return;
    if (e.target && e.target.tagName === 'BUTTON') e.target.blur();
    action();
  } else if (k === 'KeyM') { toggleMute(); }
  else if (k === 'KeyP' || k === 'Escape') { togglePause(); }
});
window.addEventListener('keyup', e => { if (e.code === 'Space' || e.code === 'Enter') e.preventDefault(); });

document.addEventListener('visibilitychange', () => {
  if (document.hidden) { Snd.suspend(); if (state === 'playing') togglePause(); }
  else Snd.resume();
});
window.addEventListener('blur', () => { if (state === 'playing') togglePause(); });
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 150));
if (window.ResizeObserver) new ResizeObserver(resize).observe(wrap);

/* =====================================================================
   INIT
===================================================================== */
buildMountains(); buildHills(); buildGround(); buildVignette();
muteBtn.textContent = muted ? '🔇' : '🔊';
resize();
goMenu();
requestAnimationFrame(frame);
})();
</script>
